name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Build the site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Copy static assets
        run: |
          # _site/{build,js,img} are symlinks into assets/ committed for local
          # development, and keep_files preserves them across the build.
          rm -rf _site/build _site/js _site/img
          cp -r assets/build assets/js assets/img _site/

      - name: Add cache-busting asset filenames
        run: |
          css_hash=$(cat templates/_data/css_hashsum.yml)
          js_hash=$(cat templates/_data/js_hashsum.yml)
          [ -e "_site/build/style.min.$css_hash.css" ] || cp _site/build/style.min.css "_site/build/style.min.$css_hash.css"
          [ -e "_site/build/app.min.$js_hash.js" ] || cp _site/build/app.min.js "_site/build/app.min.$js_hash.js"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
